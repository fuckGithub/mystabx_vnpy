[project]
name = "mystabx_vnpy"
version = "0.1.0"
description = "Stabx Vue web trader (FastAPI + headless vnpy). Desktop Qt is leftover, not the entry."
requires-python = ">=3.10"
dependencies = [
    "vnpy>=4.0.0",
    "pyside6>=6.8.2.1",
    "qdarkstyle>=3.2.3",
    "vnpy_ctastrategy",
    "vnpy_ctabacktester",
    "vnpy_datamanager",
    "vnpy_chartwizard",
    "vnpy-spreadtrading",
    "vnpy_sqlite",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "cryptography>=43",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[tool.uv]
# Mac: compile vnpy_ctp 6.7.7.2 from .deps (CTP has no 6.7.11 Mac API).
#   uv pip install .deps/vnpy_ctp
# Do not use pip install -e for vnpy_ctp.

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
pythonVersion = "3.13"
