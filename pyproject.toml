[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mystabx_vnpy"
version = "0.1.0"
description = "Stabx Vue web trader (FastAPI + headless vnpy). Desktop Qt is leftover, not the entry."
requires-python = ">=3.10"
dependencies = [
    "vnpy>=4.0.0,<5",
    "pyside6>=6.8.2.1",
    "qdarkstyle>=3.2.3",
    "vnpy_sqlite",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "cryptography>=43",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "orjson>=3.10",
]

[project.scripts]
start = "core.start:main"

[tool.setuptools.packages.find]
include = ["mystabx*", "core*", "features*"]
exclude = ["ui*", "vendor*", "licenses*", "node_modules*", "docs*", "scripts*"]

[tool.uv]
# Product start: uv run start → exec ./start.sh (Mac/Linux; args pass through).
# Keep a local CTP build: uv run --no-sync start
# Mac: compile vnpy_ctp 6.7.7.2 against SimNow official CTP v6.7.13
#   ./scripts/install_macos.sh
# Linux: compile vnpy_ctp 6.7.7.2 against Linux CTP .so (not Mac .framework)
#   ./scripts/install_linux.sh
# Windows: prefer PyPI wheel (.dll); see scripts/install_windows.ps1
#   .\scripts\install_windows.ps1
# Do not use pip install -e for vnpy_ctp. Full guide: docs/11-分平台CTP搭建.md


[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
pythonVersion = "3.13"
