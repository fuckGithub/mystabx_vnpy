[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mystabx_vnpy"
version = "0.1.0"
description = "Stabx Vue web trader (FastAPI + headless vnpy). Desktop Qt is leftover, not the entry."
requires-python = ">=3.10"
dependencies = [
    "vnpy>=4.0.0,<5",
    "pyside6>=6.8.2.1",
    "qdarkstyle>=3.2.3",
    "vnpy_sqlite",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "cryptography>=43",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Soft-loaded by MainEngine (ImportError → skip). Install what you need:
#   uv pip install -e ".[strategy]"
# Excel RTD is Windows/Excel COM only — not included here.
strategy = [
    "vnpy_ctastrategy",
    "vnpy_ctabacktester",
    "vnpy_spreadtrading",
    "vnpy_optionmaster",
    "vnpy_portfoliostrategy",
    "vnpy_algotrading",
    "vnpy_scripttrader",
    "vnpy_paperaccount",
    "vnpy_datarecorder",
    "vnpy_datamanager",
    "vnpy_riskmanager",
    "vnpy_rpcservice",
    "vnpy_chartwizard",
    "vnpy_portfoliomanager",
    "vnpy_webtrader",
]

[project.scripts]
start = "core.start:main"

[tool.setuptools.packages.find]
include = ["mystabx*", "core*", "features*"]
exclude = ["ui*", "vendor*", "licenses*", "node_modules*", "docs*", "scripts*"]

[tool.uv]
# Product start: uv run start → exec ./start.sh (args pass through; no extra --dev).
# Keep a local CTP build: uv run --no-sync start
# Mac: compile vnpy_ctp 6.7.7.2 against SimNow official CTP v6.7.13
#   ./scripts/install_macos.sh
# Linux: compile vnpy_ctp 6.7.7.2 against Linux CTP .so (not Mac .framework)
#   ./scripts/install_linux.sh
# Do not use pip install -e for vnpy_ctp.
# Strategy apps (optional): uv pip install -e ".[strategy]"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
pythonVersion = "3.13"
