# ============================================
# 开发态覆盖文件：把宿主机 backend/ 源码挂进容器（热更新）
#
# 用法（在 docker/ 目录下）：
#   docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d
#
# 只覆盖 volumes —— 端口（18080）、env_file 等全部沿用主文件。
# 生产环境与镜像交付场景（docker-compose.backend.yaml）不要使用本文件。
#
# 注意：覆盖文件无法移除主文件里的 env_file，因此本模式同样需要
# backend/env/.env.prod 存在（与主文件一致）。
# ============================================
services:
  backend:
    volumes:
      # 源码覆盖镜像内 /home；改完代码用 bash deploy.sh restart:backend 生效
      - ../backend:/home
