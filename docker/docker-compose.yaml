# ============================================
# FastapiAdmin Docker Compose 配置文件（方式 A：全套）
# ============================================
# 使用方式（在 docker/ 目录下）：
#   docker compose --env-file .env up -d
#
# 本地改代码要热更新时叠加覆盖文件：
#   docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d
#
# 应用配置来自 backend/env/.env.prod（env_file 注入，缺失时直接报错）
# 只交付后端镜像给服务器的场景见 docker-compose.backend.yaml
# ============================================

services:
  # ==================== 数据库服务 ====================
  mysql:
    container_name: mysql
    image: mysql:8.0
    restart: unless-stopped
    platform: linux/amd64
    environment:
      TZ: "Asia/Shanghai"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?错误: 请设置 MYSQL_ROOT_PASSWORD 环境变量}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-mystabx_vnpy}"
      MYSQL_USER: "${MYSQL_USER:-root}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?错误: 请设置 MYSQL_PASSWORD 环境变量}"
    ports:
      # 只绑回环：backend 容器通过 Docker 网络直连，宿主机端口仅供本地调试
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    networks:
      - app_network
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

  # ==================== Redis 服务 ====================
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    platform: linux/amd64
    environment:
      TZ: "Asia/Shanghai"
    ports:
      # 只绑回环：backend 容器通过 Docker 网络直连，宿主机端口仅供本地调试
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?错误: 请设置 REDIS_PASSWORD 环境变量}
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
    networks:
      - app_network
    healthcheck:
      test:
        ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  # ==================== 后端服务 ====================
  backend:
    container_name: backend
    build:
      context: ../
      dockerfile: ./docker/backend/Dockerfile
    image: fastapiadmin-backend:${IMAGE_TAG:-3.1.0}
    restart: unless-stopped
    platform: linux/amd64
    environment:
      TZ: "Asia/Shanghai"
      ENVIRONMENT: "prod" # 决定 pydantic 加载 env/.env.prod
      SERVER_PORT: "18080" # OS 环境变量优先级最高，压住配置文件里的旧值
      DATABASE_HOST: "mysql"
      DATABASE_PASSWORD: "${MYSQL_PASSWORD}"
      DATABASE_PORT: "3306"
      DATABASE_NAME: "${MYSQL_DATABASE:-mystabx_vnpy}"
      DATABASE_USER: "${MYSQL_USER:-root}"
      REDIS_HOST: "redis"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_PORT: "6379"
      # 是否启用验证码（生产环境建议启用，开发环境可禁用以简化登录流程）
      CAPTCHA_ENABLE: "false"
    # 应用配置以环境变量注入（优先级：environment > env_file > 代码默认值）
    # 文件缺失时 compose 直接报错退出，不会静默使用默认值
    env_file:
      - ../backend/env/.env.prod
    ports:
      - "${BACKEND_PORT:-18080}:18080"
    # 源码不再挂载（镜像已自包含）；热更新请叠加 docker-compose.dev.yaml
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:18080/common/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m

  # ==================== Nginx 服务 ====================
  nginx:
    container_name: nginx
    image: nginx:1.25-alpine
    restart: unless-stopped
    platform: linux/amd64
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/web:/usr/share/nginx/html/web:ro
      - ./nginx/app:/usr/share/nginx/html/app:ro
      - ./nginx/docs:/usr/share/nginx/html/docs:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
      - ./nginx/ssl/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m

  # ==================== Certbot（Let's Encrypt 证书签发/续签） ====================
  certbot:
    container_name: certbot
    image: certbot/certbot:latest
    platform: linux/amd64
    profiles: ["manual"]  # 不随 docker compose up 自动启动
    entrypoint: certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/ssl/www:/var/www/certbot
    depends_on:
      nginx:
        condition: service_started

# ==================== 持久化卷 ====================
volumes:
  mysql_data:
    driver: local
    driver_opts:
      type: none
      device: ./mysql/data
      o: bind
  redis_data:
    driver: local
    driver_opts:
      type: none
      device: ./redis/data
      o: bind

# ==================== 网络 ====================
networks:
  app_network:
    driver: bridge
