# ============================================
# 方式 B 的可选本地依赖：本机没有 MySQL/Redis 时叠加本文件
#
#   docker compose -f docker-compose.backend.yaml -f docker-compose.local-deps.yaml up -d
#   （等价于 bash deploy.sh start --local-deps）
#
# 数据用命名卷保存（本模式主用外部数据库，本机依赖定位为便利设施）。
# depends_on 只能写在这里：base 文件若引用未定义服务，不带本文件时整份项目解析失败。
# ============================================

services:
  backend:
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 覆盖 env.prod 里的外部地址（OS 环境变量优先级最高）
      DATABASE_HOST: "mysql"
      DATABASE_PORT: "3306"
      DATABASE_NAME: "${MYSQL_DATABASE:-mystabx_vnpy}"
      DATABASE_USER: "${MYSQL_USER:-root}"
      DATABASE_PASSWORD: "${MYSQL_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

  # ==================== MySQL（本地依赖） ====================
  mysql:
    container_name: backend-mysql
    image: mysql:8.0
    restart: unless-stopped
    platform: linux/amd64
    environment:
      TZ: "Asia/Shanghai"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?错误: 请设置 MYSQL_ROOT_PASSWORD 环境变量}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-mystabx_vnpy}"
      MYSQL_USER: "${MYSQL_USER:-root}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?错误: 请设置 MYSQL_PASSWORD 环境变量}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ==================== Redis（本地依赖） ====================
  redis:
    container_name: backend-redis
    image: redis:7-alpine
    restart: unless-stopped
    platform: linux/amd64
    environment:
      TZ: "Asia/Shanghai"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?错误: 请设置 REDIS_PASSWORD 环境变量}
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ==================== 数据卷 ====================
volumes:
  mysql_data:
  redis_data:
